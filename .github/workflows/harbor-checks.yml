name: Harbor checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harbor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Harbor Core
        run: npm run verify:core
      - name: Compare visual snapshots
        id: visual-comparison
        continue-on-error: true
        run: npm run test:visual
      - name: Generate candidate snapshots
        if: steps.visual-comparison.outcome == 'failure'
        run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        if: always() && steps.visual-comparison.outcome == 'failure'
        with:
          name: harbor-visual-candidates
          path: tests/visual/snapshots/*.png
          if-no-files-found: error
      - name: Fail on visual regression
        if: always() && steps.visual-comparison.outcome == 'failure'
        run: exit 1
