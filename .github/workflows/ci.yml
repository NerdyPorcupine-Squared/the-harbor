name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify Core
        run: npm run verify:core

      - name: Check publication candidate
        run: npm run check:publication

      - name: Test Chromium
        run: npm run test:visual

      - name: Publish generated theme on rework branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/rework/runtime-contracts'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add theme.css .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No generated theme changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh generated theme"
          git push origin HEAD:rework/runtime-contracts

      - name: Upload generated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-generated-candidate
          path: theme.css
          if-no-files-found: error

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
