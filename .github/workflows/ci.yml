name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: harbor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify Core
        run: npm run verify:core

      - name: Check publication candidate
        run: npm run check:publication

      - name: Test Chromium
        run: npm run test:visual

      - name: Reject generated CSS drift on release branches
        if: startsWith(github.ref_name, 'release/')
        shell: pwsh
        run: |
          git diff --exit-code -- theme.css
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Generated theme.css drifted on a release branch. Regenerate and commit it before freezing the candidate."
            exit 1
          }

      - name: Sync generated candidate on development branches
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && !startsWith(github.ref_name, 'release/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- theme.css
          if ($LASTEXITCODE -ne 0) {
            git add theme.css
            git commit -m "build: sync generated runtime recovery css"
            git push origin "HEAD:${{ github.ref_name }}"
          }

      - name: Upload generated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-generated-candidate
          path: theme.css
          if-no-files-found: error

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
