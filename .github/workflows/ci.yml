name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify Core
        run: npm run verify:core

      - name: Check publication candidate
        run: npm run check:publication

      - name: Approve reviewed visual baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/treasure-map-rc'
        run: npm run test:visual:update

      - name: Test Chromium
        run: npm run test:visual

      - name: Commit approved candidate artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/treasure-map-rc'
        shell: pwsh
        run: |
          npm run build:css
          npm run check:publication
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml theme.css tests/visual/snapshots/win32
          $changes = git diff --cached --name-only
          if (-not $changes) {
            throw "Expected reviewed baseline or generated candidate changes, but none were staged."
          }
          git commit -m "test: approve treasure map visual baselines"
          git push origin HEAD:feat/treasure-map-rc

      - name: Upload generated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-generated-candidate
          path: theme.css
          if-no-files-found: error

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
