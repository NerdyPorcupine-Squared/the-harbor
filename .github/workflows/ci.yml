name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Core
        run: npm run verify:core

      - name: Check publication candidate
        run: npm run check:publication

      - name: Test Chromium
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') != '' }}
        run: npm run test:visual

      - name: Bootstrap Linux screenshot baselines
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') == '' }}
        run: npm run test:visual:update

      - name: Add Linux baselines to publication manifest
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') == '' && github.event_name == 'push' }}
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("publication-manifest.json", "utf8"));
            const snapshots = readdirSync("tests/visual/snapshots/linux")
              .map((name) => `tests/visual/snapshots/linux/${name}`);
            manifest.files = [...new Set([...manifest.files, ...snapshots])].sort();
            writeFileSync("publication-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Commit Linux screenshot baselines
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') == '' && github.event_name == 'push' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add tests/visual/snapshots/linux publication-manifest.json
          git commit -m "test: add Linux Chromium baselines"
          git push origin "HEAD:${GITHUB_REF_NAME}"
