name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Core
        run: npm run verify:core

      - name: Check publication candidate
        run: npm run check:publication

      - name: Test Chromium
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') != '' }}
        run: npm run test:visual

      - name: Bootstrap Linux screenshot baselines
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') == '' }}
        run: npm run test:visual:update

      - name: Upload bootstrapped Linux baselines
        if: ${{ hashFiles('tests/visual/snapshots/linux/*.png') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/visual/snapshots/linux
          if-no-files-found: error
