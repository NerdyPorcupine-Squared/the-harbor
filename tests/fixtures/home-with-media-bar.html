<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harbor fixture with featured media</title>
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="fixture.css">
  </head>
  <body>
    <header class="skinHeader headerTop">
      <button class="headerButton" type="button" aria-label="Open navigation">☰</button>
      <div class="harbor-brand">The Harbor</div>
      <nav class="headerTabs" aria-label="Main sections">
        <button class="emby-tab-button" type="button" aria-selected="true">Home</button>
        <button class="emby-tab-button" type="button" aria-selected="false">Voyages</button>
        <button class="emby-tab-button" type="button" aria-selected="false">Collections</button>
      </nav>
      <button class="headerButton" type="button" aria-label="Search">⌕</button>
    </header>
    <main class="mainAnimatedPage homePage">
      <section id="slides-container">
        <article class="slide active">
          <video class="backdrop-video" muted></video>
          <div class="mediaBarInfo">
            <h1>North Star</h1>
            <p>A sanitized fixture voyage.</p>
            <button class="play-button">Play</button>
            <button class="detail-button">Details</button>
          </div>
          <div class="mediaBarControls" aria-label="Featured controls"></div>
        </article>
      </section>
      <div class="home-rows">
        <section class="horizontalSection" aria-labelledby="featured-recent-title">
          <div class="section-header">
            <h2 class="section-title" id="featured-recent-title">Continue Watching</h2>
            <button class="paper-icon-button-light" type="button" aria-label="Next row">→</button>
          </div>
          <div class="itemsContainer">
            <article class="card landscape">
              <div class="cardBox">
                <div class="cardScalable">
                  <div class="cardImageContainer" role="img" aria-label="Abstract open water artwork"></div>
                  <div class="itemProgressBar" aria-label="62 percent watched">
                    <div class="itemProgressBarForeground"></div>
                  </div>
                </div>
                <h3 class="cardText">Open Water</h3>
                <div class="card-actions">
                  <button type="button">Play</button>
                  <button class="fixture-focus" type="button" autofocus>Details</button>
                </div>
              </div>
            </article>
            <article class="card landscape">
              <div class="cardBox">
                <div class="cardScalable">
                  <div class="cardImageContainer" role="img" aria-label="Abstract lantern artwork"></div>
                  <span class="playedIndicator" aria-label="Watched">✓</span>
                </div>
                <h3 class="cardText">Lantern Watch</h3>
                <div class="card-actions">
                  <button type="button">Play</button>
                  <button type="button">Details</button>
                </div>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
