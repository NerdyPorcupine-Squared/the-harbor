<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harbor library fixture</title>
    <link rel="stylesheet" href="../../../theme.css">
    <style>
      * { box-sizing: border-box; }
      .fixture-header { min-height: 4.5rem; padding: 0.75rem 1rem; }
      .fixture-header h1 { margin: 0; }
      .fixture-label { display: grid; gap: 0.25rem; }
      .art-one { background: radial-gradient(circle at 68% 25%, #d3b873 0 8%, transparent 9%), linear-gradient(155deg, #355c70 0 45%, #173647 46% 61%, #07131c 62%); }
      .art-two { background: linear-gradient(35deg, transparent 40%, rgb(184 148 75 / 62%) 41% 45%, transparent 46%), linear-gradient(145deg, #43685f, #0c1d29); }
      .art-wide { background: radial-gradient(ellipse at 72% 35%, #d8bd82 0 7%, transparent 8%), linear-gradient(165deg, #31546b 0 48%, #173647 49% 62%, #07131c 63%); }
    </style>
  </head>
  <body class="skinBody">
    <div class="backgroundContainer"></div>
    <header class="skinHeader fixture-header"><h1>The Harbor Library</h1></header>
    <main class="libraryPage mainAnimatedPage">
      <h2 class="sectionTitle">Chart Room Collection</h2>
      <form class="libraryToolbar" aria-label="Library controls">
        <label class="fixture-label">Filter
          <select class="emby-select"><option>All voyages</option><option>Unwatched</option></select>
        </label>
        <label class="fixture-label">Sort
          <select class="emby-select"><option>Title</option><option>Year</option></select>
        </label>
        <label class="checkboxLabel">
          <input class="emby-checkbox" type="checkbox" checked>
          Include archived charts
        </label>
        <button class="button-submit" type="button">Apply</button>
        <button class="button-flat" type="button" disabled>Unavailable filter</button>
      </form>
      <div class="itemsContainer libraryGrid">
        <article class="card selected">
          <div class="cardBox">
            <div class="cardImageContainer art-one">
              <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play Beacon Shoal">▶</button></div>
            </div>
            <div class="itemProgressBar"><div class="itemProgressBarForeground" style="width: 64%"></div></div>
            <div class="cardText">Beacon Shoal</div>
            <div class="cardText cardText-secondary">Selected voyage</div>
          </div>
        </article>
        <article class="card">
          <div class="cardBox">
            <div class="cardImageContainer art-two">
              <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play Lanterns at Low Tide">▶</button></div>
            </div>
            <div class="cardText">Lanterns at Low Tide</div>
            <div class="cardText cardText-secondary">Unwatched</div>
          </div>
        </article>
        <article class="card card-landscape">
          <div class="cardBox">
            <div class="cardImageContainer cardImageContainer-landscape art-wide">
              <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play Cartographer's Wake">▶</button></div>
            </div>
            <div class="cardText">The Cartographer's Wake</div>
            <div class="cardText cardText-secondary">Landscape feature</div>
          </div>
        </article>
        <article class="card">
          <div class="cardBox">
            <div class="cardImageContainer">
              <div class="missingIndicator">Artwork chart unavailable</div>
              <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play Harbor Without Stars">▶</button></div>
            </div>
            <div class="cardText">Harbor Without Stars</div>
            <div class="cardText cardText-secondary">Missing art</div>
          </div>
        </article>
        <article class="card" aria-disabled="true">
          <div class="cardBox">
            <div class="cardImageContainer art-one"></div>
            <div class="cardText">Tide Ledger</div>
            <div class="cardText cardText-secondary">Disabled</div>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
