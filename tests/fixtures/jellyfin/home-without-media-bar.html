<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harbor home without Media Bar fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .cardScalable {
        position: relative;
      }

      .cardPadder {
        position: relative;
      }

      .cardPadder-portrait {
        padding-bottom: 150%;
      }

      .cardPadder-backdrop {
        padding-bottom: 56.25%;
      }

      .cardContent {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .cardScalable .cardImageContainer {
        width: 100%;
        height: 100%;
      }

      .cardBox {
        padding: 0 !important;
        margin: 0.6em;
      }

    </style>
    <link rel="stylesheet" href="../../../theme.css">
    <style>
      .fixture-header {
        min-height: 4.5rem;
        padding: 0.75rem 1rem;
      }

      .fixture-header h1 {
        margin: 0;
      }

      .fixture-art-one {
        background:
          radial-gradient(circle at 70% 28%, #d3b873 0 8%, transparent 9%),
          linear-gradient(155deg, #355c70 0 44%, #173647 45% 60%, #07131c 61%);
      }

      .fixture-art-two {
        background:
          linear-gradient(32deg, transparent 40%, rgb(184 148 75 / 62%) 41% 45%, transparent 46%),
          radial-gradient(circle at 26% 23%, #ead9ae 0 7%, transparent 8%),
          linear-gradient(145deg, #43685f, #0c1d29);
      }

      .fixture-art-three {
        background:
          linear-gradient(180deg, transparent 55%, rgb(7 19 28 / 72%) 56%),
          radial-gradient(ellipse at 74% 38%, #d8bd82 0 7%, transparent 8%),
          linear-gradient(165deg, #31546b 0 48%, #173647 49% 62%, #07131c 63%);
      }
    </style>
  </head>
  <body class="skinBody">
    <div class="backgroundContainer"></div>
    <header class="skinHeader fixture-header">
      <h1>The Harbor</h1>
    </header>
    <main class="mainAnimatedPage">
      <div class="homeSectionsContainer">
        <section class="homeSection" aria-labelledby="continue-heading">
          <h2 class="sectionTitle" id="continue-heading">Continue the Voyage</h2>
          <div class="itemsContainer">
            <article class="card">
              <div class="cardBox">
                <div class="cardScalable">
                  <div class="cardPadder cardPadder-portrait"></div>
                  <div class="cardContent">
                    <div class="cardImageContainer fixture-art-one">
                      <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play Beacon Shoal">▶</button></div>
                      <div class="itemProgressBar"><div class="itemProgressBarForeground" style="width: 64%"></div></div>
                    </div>
                  </div>
                </div>
                <div class="cardText">Beacon Shoal</div>
                <div class="cardText cardText-secondary">Resume the chart</div>
              </div>
            </article>
            <article class="card">
              <div class="cardBox">
                <div class="cardScalable">
                  <div class="cardPadder cardPadder-portrait"></div>
                  <div class="cardContent">
                    <div class="cardImageContainer fixture-art-two">
                      <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play Lanterns at Low Tide">▶</button></div>
                    </div>
                  </div>
                </div>
                <div class="cardText">Lanterns at Low Tide</div>
                <div class="cardText cardText-secondary">New arrival</div>
              </div>
            </article>
            <article class="card">
              <div class="cardBox">
                <div class="cardScalable">
                  <div class="cardPadder cardPadder-portrait"></div>
                  <div class="cardContent">
                    <div class="cardImageContainer fixture-art-three">
                      <div class="cardOverlayContainer"><button class="cardOverlayButton" type="button" aria-label="Play The Cartographer's Wake">▶</button></div>
                    </div>
                  </div>
                </div>
                <div class="cardText">The Cartographer's Wake</div>
                <div class="cardText cardText-secondary">Three chapters</div>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
